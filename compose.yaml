services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_product
      POSTGRES_USER: agent_product
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_product -d agent_product"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agent_product:change-me@db:5432/agent_product
      AUTO_CREATE_TABLES: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:

